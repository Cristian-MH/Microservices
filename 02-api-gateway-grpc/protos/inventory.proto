syntax = "proto3";

option csharp_namespace = "Microservices.Contracts.Inventory";

package inventory;

service Inventory {
  rpc GetStock (GetStockRequest) returns (Stock);
}

message GetStockRequest {
  string product_id = 1;
}

message Stock {
  string product_id = 1;
  int32 quantity = 2;
  bool available = 3;
}