name: example04-pubsub

x-app: &app
  restart: unless-stopped
  environment:
    RabbitMQ__Host: rabbitmq
    RabbitMQ__Username: demo
    RabbitMQ__Password: demo-password
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo-password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  order-service:
    <<: *app
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    ports: ["127.0.0.1:5401:8080"]

  inventory-service:
    <<: *app
    build:
      context: .
      dockerfile: InventoryService/Dockerfile
    ports: ["127.0.0.1:5402:8080"]

  notification-service:
    <<: *app
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    ports: ["127.0.0.1:5403:8080"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-demo
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
